name: Update GitHub Trophy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trophy.yml"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=alvinaaulia&theme=darkhub&column=8&margin-w=8&margin-h=0&no-frame=true&no-bg=true"
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy SVG
        run: |
          test -f trophy.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub trophy"
          git push
